name: Validate and test preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m src.guide validate
      - run: python -m src.guide content-audit
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m src.guide build
      - run: node src/web/benchmark.mjs
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests/e2e -p 'test_browser.py'
      # Clinical sign-off is intentionally not implied by this successful job.
